name: Test basic usage - install latest just
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-just
        uses: .
      - name: Assert just is installed and executable
        run: |
          echo "Checking just is on PATH..."
          if ! command -v just &>/dev/null; then
            echo "FAIL: just not found on PATH"
            exit 1
          fi
          echo "PASS: just found at $(command -v just)"
      - name: Assert just runs successfully
        run: |
          VERSION=$(just --version)
          echo "just version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: just --version returned empty output"
            exit 1
          fi
          echo "PASS: just --version returned '$VERSION'"
