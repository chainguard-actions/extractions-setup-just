name: Test basic usage (install latest just)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
      - name: Assert just is installed and executable
        run: |
          echo "Checking just is on PATH..."
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: 'just' not found on PATH"
            exit 1
          fi
          echo "PASS: just is on PATH"
      - name: Assert just runs successfully
        run: |
          VERSION_OUTPUT="$(just --version 2>&1)"
          echo "just --version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qiE 'just [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: just reports a valid version"
