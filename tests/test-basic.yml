name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert just is installed
        run: |
          echo "Checking just is available..."
          if ! command -v just &>/dev/null; then
            echo "FAIL: 'just' command not found in PATH"
            exit 1
          fi
          echo "just version: $(just --version)"
          echo "PASS"
