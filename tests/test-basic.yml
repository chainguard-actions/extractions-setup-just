name: Test basic usage (no version specified)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert just is installed
        run: |
          echo "just version: $(just --version)"
          if ! just --version; then
            echo "FAIL: just is not installed or not working"
            exit 1
          fi
          echo "PASS"
