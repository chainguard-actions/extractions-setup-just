name: Test basic usage (latest just)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert just is installed
        run: |
          echo "Checking just is on PATH..."
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: just not found on PATH"
            exit 1
          fi
          echo "just version: $(just --version)"
          echo "PASS"
