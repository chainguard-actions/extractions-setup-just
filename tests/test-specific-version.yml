name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-just
        uses: .
        with:
          just-version: '1.25.2'
          github-token: ${{ github.token }}
      - name: Assert just is installed at the requested version
        run: |
          echo "Checking just is on PATH..."
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: 'just' not found on PATH"
            exit 1
          fi
          echo "PASS: just is on PATH"
          VERSION="$(just --version 2>&1)"
          echo "version: $VERSION"
          if echo "$VERSION" | grep -q "1.25.2"; then
            echo "PASS: correct version 1.25.2 installed"
          else
            echo "FAIL: expected version 1.25.2 but got '$VERSION'"
            exit 1
          fi
