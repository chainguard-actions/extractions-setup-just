name: Test specific just version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          just-version: "1.14.0"
      - name: Assert just is installed at the correct version
        run: |
          ACTUAL=$(just --version 2>&1)
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "1.14.0"; then
            echo "FAIL: expected just version 1.14.0, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"
