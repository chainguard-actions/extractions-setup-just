name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          just-version: '1.14.0'
          github-token: ${{ github.token }}
      - name: Assert just is installed at the requested version
        run: |
          echo "Checking just is on PATH..."
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: 'just' not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(just --version 2>&1)"
          echo "just --version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q '1.14.0'; then
            echo "FAIL: expected version 1.14.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: just 1.14.0 is installed"
