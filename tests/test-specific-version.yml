name: Test specific just version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          just-version: "1.34.0"
      - name: Assert just is installed with correct version
        run: |
          INSTALLED_VERSION=$(just --version | awk '{print $2}')
          echo "installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "1.34.0" ]; then
            echo "FAIL: expected version '1.34.0' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS"
