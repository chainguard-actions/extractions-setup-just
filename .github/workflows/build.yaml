name: build

on:
  push:
  schedule:
    - cron: 0 12 1 * *

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version: '18'
    - run: npm ci
    - run: npm run lint
    - run: npm run build

  test-latest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Setup just
      uses: ./
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Test
      run: |
        [ "$(just --justfile tests/Justfile)" = "Test..." ]
      shell: bash

  test-version:
    needs: test-latest
    strategy:
      matrix:
        just-version: [0.5.11, 0.6.1, 0.7.3, 0.8.7, 0.9.9, 0.10.7, 0.11.2, 1.5.0]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Run self
      uses: ./
      with:
        just-version: ${{ matrix.just-version }}
    - name: Check version
      env:
        JUST_VERSION: ${{ matrix.just-version }}
      run: just --version | grep -E "^just v?${JUST_VERSION}$"
    - name: Test
      run: |
        [ "$(just --justfile tests/Justfile)" = "Test..." ]
